name: Publish @tecture/shared to npm

on:
  push:
    tags:
      - "shared-v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build + verify the tarball only, do not publish."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish @tecture/shared
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @tecture/shared typecheck

      - name: Build
        run: pnpm --filter @tecture/shared build

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/shared-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/shared-v}"
          PKG_VERSION="$(node -p "require('./packages/shared/package.json').version")"
          echo "tag=$TAG pkg=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag shared-v$TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Verify publishable tarball
        run: pnpm --filter @tecture/shared publish --dry-run --no-git-checks

      - name: Publish to npm
        if: inputs.dry-run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          pnpm --filter @tecture/shared publish --no-git-checks

      - name: Create GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/shared-v') &&
          inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#shared-v}"
          gh release create "$TAG" \
            --title "@tecture/shared $VERSION" \
            --notes "\`npm i @tecture/shared@$VERSION\` · see the [repo](https://github.com/${{ github.repository }}#readme)."
