name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Self-test evidence script
        # node:sqlite needs >= 22.5 — the script itself hard-errors below that,
        # so only the 22 leg runs it.
        if: matrix.node >= 22
        run: node .claude/skills/architecture-docs/scripts/evidence.mjs --self-test

      - name: Build
        run: pnpm build

      - name: Verify published tarball
        run: pnpm --filter @tecture/core publish --dry-run --no-git-checks
