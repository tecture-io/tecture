<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #icon { width: 256px; height: 256px; display: block; }
</style>
</head>
<body>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1628"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="44" fill="url(#bg)"/>

  <!-- faint blueprint grid -->
  <g stroke="rgba(34, 78, 130, 0.18)" stroke-width="1">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- connection lines -->
  <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M84 76 L172 76"/>
    <path d="M70 100 L120 176"/>
    <path d="M186 100 L136 176"/>
  </g>

  <!-- three component nodes -->
  <g filter="url(#glow)">
    <rect x="34" y="48" width="64" height="56" rx="8" fill="url(#node)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="158" y="48" width="64" height="56" rx="8" fill="url(#node)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="96" y="176" width="64" height="56" rx="8" fill="url(#node)" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- node "screws" / dots to suggest schematic detail -->
  <g fill="#0a0f1a" opacity="0.55">
    <circle cx="42" cy="56" r="2"/>
    <circle cx="90" cy="56" r="2"/>
    <circle cx="166" cy="56" r="2"/>
    <circle cx="214" cy="56" r="2"/>
    <circle cx="104" cy="184" r="2"/>
    <circle cx="152" cy="184" r="2"/>
  </g>
</svg>
</body>
</html>
